<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多周期K线联动</title>
<!--
  多周期K线联动看盘(币安USDT永续合约,只读公开行情,不需要API Key)
  - 三个窗口同一个合约、不同周期(默认 1小时/15分钟/5分钟,每个窗口可单独改)
  - 拖动/缩放任何一个窗口,另外两个自动滚到同一时间(各自保持自己的缩放)
  - 十字光标同步: 鼠标指到某根K线,另外两个窗口同一时刻也显示竖线
  - 往左拖到头会自动加载更早的K线; 最新K线走币安WebSocket实时更新
  - 可以拆成2个或3个独立的浏览器窗口(顶部"窗口"下拉), 各窗口之间照样同步时间/光标/合约, "合并"收回一个窗口
    (窗口之间用 BroadcastChannel 通信, 同一个浏览器里打开的才能互相同步)
  - 测量: 按住 Shift 拖动(或点"📏测量"后直接拖动)选一段K线, 显示这一段的涨跌幅/振幅/起止时间/时长;
    点一下或按 Esc 清除
  - 固定时间(复盘): 以最小周期窗口画面最右边那根K线的收盘时刻为"当前时间", 大周期只显示到这个时间,
    没走完的那根用最小周期K线现场拼出来; 往右拖最小周期, 大周期K线一点点长出来; 大周期最右边始终对齐当前时间
  - 本地缓存: 拿到过的K线(含成交额)存在这台电脑浏览器的 IndexedDB 里, 以后先读本地, 只向币安要最新那一段;
    "⬇下载历史"一次把当前合约各周期的历史存到本地。所有请求统一限速(每0.3秒最多1个), 被币安限流时全部暂停到解封
  - 持仓量: 每个窗口最下面一排"持仓K线": 开=K线开盘时持仓, 收=收盘时持仓, 高低=期间最高最低, 增加绿/减少红
    (复盘时正在走的那根截到"当前时间");
    从Mac看盘服务打开时读Mac数据库(5分钟一个点), 从GitHub打开时直接问币安(只有最近一段)
  用法: 直接双击用浏览器打开; 也可以带参数 mtf_chart.html?symbol=ain
  注意: 跟其他脚本一样,需要能访问 fapi.binance.com(VPN开着)
-->
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0e11;--panel:#161a1e;--grid:#1f2429;--line:#2b3139;--text:#eaecef;--muted:#848e9c;--up:#0ecb81;--down:#f6465d;--accent:#f0b90b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px -apple-system,"PingFang SC",sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{color:var(--accent);font-size:15px;margin-right:4px}
input,select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit}
input{width:130px;text-transform:uppercase}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
a{color:var(--muted);text-decoration:none}
a:hover{color:var(--accent)}
#status{color:var(--muted)}
#status.err{color:var(--down)}
.links{margin-left:auto;display:flex;gap:12px}
#grid{flex:1;display:grid;gap:4px;padding:4px;min-height:0}
#grid.cols{grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
#grid.rows{grid-auto-flow:row;grid-auto-rows:minmax(0,1fr)}
.pane{background:var(--panel);border:1px solid var(--line);min-height:0;min-width:0;display:flex;flex-direction:column}
.pane.active{border-color:#4a4f57}
.pane .bar{display:flex;gap:8px;align-items:center;padding:4px 6px;border-bottom:1px solid var(--line)}
.pane .bar select{padding:2px 4px}
.legend{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .up{color:var(--up)}.legend .down{color:var(--down)}
.pane .chart{flex:1;min-height:0;position:relative}
.measure{position:absolute;top:0;display:none;pointer-events:none;z-index:4;border-left:1px dashed;border-right:1px dashed}
.measure.up{background:rgba(14,203,129,.13);border-color:rgba(14,203,129,.8)}
.measure.down{background:rgba(246,70,93,.13);border-color:rgba(246,70,93,.8)}
.mlabel{position:absolute;top:6px;display:none;pointer-events:none;z-index:5;background:rgba(24,28,33,.94);border:1px solid var(--line);
  border-radius:4px;padding:5px 8px;font-size:12px;line-height:1.55;white-space:nowrap;font-variant-numeric:tabular-nums}
.mlabel .big{font-size:14px;font-weight:600}
.mlabel .up{color:var(--up)}.mlabel .down{color:var(--down)}.mlabel .dim{color:var(--muted)}
body.measuring .chart{cursor:crosshair}
#measure.on,#replay.on{border-color:var(--accent);color:var(--accent)}
#replay.on{background:rgba(240,185,11,.12)}
#hline.on{border-color:var(--accent);color:var(--accent)}
#colors{display:inline-flex;gap:4px;align-items:center}
#colors i{width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-sizing:border-box}
#colors i.sel{border-color:#fff}
body.drawing .chart, body.drawing .chart *{cursor:crosshair!important}
.chart.nearline, .chart.nearline *{cursor:ns-resize!important}
.band{position:absolute;top:0;display:none;pointer-events:none;z-index:3;background:rgba(240,185,11,.13);border-left:1px solid rgba(240,185,11,.6);border-right:1px solid rgba(240,185,11,.6)}
#star{padding:4px 7px;color:var(--muted)}
.symwrap{position:relative;display:inline-block}
#symlist{position:absolute;top:100%;left:0;margin-top:2px;z-index:60;min-width:100%;max-height:340px;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
#symlist[hidden]{display:none}
#symlist div{padding:4px 10px;cursor:pointer;white-space:nowrap}
#symlist div.on,#symlist div:hover{background:rgba(240,185,11,.15);color:var(--accent)}
#symlist .none{color:var(--muted);cursor:default}
#star.on{color:var(--accent);border-color:var(--accent)}
#favbtn.on{border-color:var(--accent);color:var(--accent)}
.mlabel .favbtn{pointer-events:auto;cursor:pointer;display:inline-block;margin-top:4px;padding:1px 8px;border:1px solid var(--accent);border-radius:3px;color:var(--accent)}
.mlabel .favbtn:hover{background:rgba(240,185,11,.15)}
.mlabel .bmtag{color:var(--accent);margin-bottom:2px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;display:flex;min-height:0}
#main #grid{flex:1;min-width:0}
#favpanel{flex:none;width:540px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
@media (max-width:1100px){#favpanel{position:fixed;top:0;right:0;bottom:0;max-width:100vw;z-index:50;box-shadow:-8px 0 24px rgba(0,0,0,.45)}}
#favpanel[hidden]{display:none}
.fp-head{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.fp-head .tab{padding:4px 12px;border-radius:4px;cursor:pointer;color:var(--muted)}
.fp-head .tab.on{background:rgba(240,185,11,.12);color:var(--accent)}
.fp-head #fpclose{margin-left:auto;padding:2px 9px}
.fp-body{flex:1;overflow:auto;padding:8px 10px}
.fp-groups{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fp-groups span{padding:2px 9px;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--muted);user-select:none;white-space:nowrap}
.fp-groups span.on{border-color:var(--accent);color:var(--accent)}
.fp-groups span i{font-style:normal;opacity:.6;margin-left:3px}
.fp-groups span[data-drag=true]{cursor:grab;touch-action:none}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;background:var(--panel);border:1px solid var(--accent);color:var(--accent);
  border-radius:12px;padding:2px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.fp-groups span.dragging{opacity:.35}
.fp-groups span.drop-l{box-shadow:-3px 0 0 var(--accent)}
.fp-groups span.drop-r{box-shadow:3px 0 0 var(--accent)}
.fp-groups span.drop-in{background:rgba(240,185,11,.2);border-color:var(--accent);color:var(--accent)}
.fp-groups .del{visibility:hidden;font-weight:normal;margin:0 -4px 0 4px;padding:0 3px;border-radius:50%;color:var(--muted)}
.fp-groups span:hover .del{visibility:visible}
.fp-groups .del:hover{color:#fff;background:var(--down)}
#fp-table tbody td.nm{cursor:grab}
#fp-table tbody{user-select:none}
#fp-table tbody tr.dragging td{opacity:.4}
.fp-tools{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.fp-tools button{padding:3px 8px}
.fp-hint{color:var(--muted);font-size:12px;margin:6px 0 10px;line-height:1.5}
#fp-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
#fp-table th{color:var(--muted);font-weight:normal;text-align:right;padding:4px;cursor:pointer;white-space:nowrap;user-select:none;border-bottom:1px solid var(--line)}
#fp-table th:first-child,#fp-table td:first-child{text-align:left}
#fp-table th.sorted{color:var(--accent)}
#fp-table td{padding:5px 4px;text-align:right;border-bottom:1px solid #1f2429;white-space:nowrap}
#fp-table tr.cur td{background:rgba(240,185,11,.07)}
#fp-table tbody tr:hover td{background:#1e2329}
#fp-table td.nm{cursor:pointer;font-weight:600}
#fp-table td.nm:hover{color:var(--accent)}
#fp-table .up{color:var(--up)}#fp-table .down{color:var(--down)}
#fp-table td.big{color:#b7bdc6}
#fp-table select{padding:1px 2px;font-size:12px;max-width:72px}
.x{cursor:pointer;color:var(--muted);padding:0 4px}.x:hover{color:var(--down)}
.seg{border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-bottom:7px;cursor:pointer;line-height:1.6}
.seg:hover{border-color:var(--accent)}
.seg .tag{color:var(--accent);border:1px solid rgba(240,185,11,.5);border-radius:3px;padding:0 5px;font-size:12px;margin-left:4px}
.seg .up{color:var(--up)}.seg .down{color:var(--down)}.seg .dim{color:var(--muted);font-size:12px}
.seg .ops{float:right}
.seg .note{color:var(--text)}
@media (max-width:900px){#grid.cols{grid-auto-flow:row;grid-auto-rows:minmax(260px,1fr);grid-auto-columns:auto}#grid{overflow:auto}}
</style>
</head>
<body>
<header>
  <b>多周期联动</b><span id="src" style="color:var(--muted);font-size:12px"></span>
  <span class="symwrap"><input id="sym" placeholder="币安合约,如 AIN" autocomplete="off" spellcheck="false"><div id="symlist" hidden></div></span>
  <button id="star" title="收藏/取消收藏当前合约">☆</button>
  <button id="go">打开</button>
  <button id="favbtn" title="收藏的合约(带价格/涨跌幅/分组)和收藏的K线段(点一下三个周期一起跳过去)">⭐ 收藏</button>
  <button id="layout">竖排</button>
  <button id="latest" title="所有周期一键回到最新时间/最新价格">⏭ 回到最新</button>
  <button id="scale">对数坐标</button>
  <button id="replay" title="复盘: 大周期只显示到最小周期画面最右边的时间, 往右拖最小周期, 大周期K线一点点长出来">⏸ 固定时间</button>
  <button id="dl" title="把当前合约各周期的历史K线一次下载到本机浏览器里, 以后看历史/复盘基本不用联网">⬇ 下载历史</button>
  <button id="measure" title="打开后直接拖动就是测量; 不打开时按住Shift拖动也能测量; Esc清除">📏 测量</button>
  <button id="hline" title="点一下按钮, 再在K线图上点一下 = 在那个价格画一条横线(所有周期都显示)&#10;拖动横线 = 移动; 点一下横线 = 选中, 再点颜色改色, 按 Delete 删除; 右键横线 = 删除">➖ 画线</button>
  <span id="colors" title="横线颜色"></span>
  <button id="clrlines" title="删除这个合约的所有横线">清除线</button>
  <select id="split" title="拆成几个独立窗口(各窗口同步)">
    <option value="1">1个窗口</option><option value="2">拆成2个窗口</option><option value="3">拆成3个窗口</option>
  </select>
  <button id="merge" style="display:none">合并窗口</button>
  <span id="status"></span>
  <span class="links">
    <a id="lnk-tf" target="_blank">TradeFlow</a>
    <a id="lnk-cg" target="_blank">CoinGlass</a>
    <a id="lnk-tv" target="_blank">TradingView</a>
  </span>
</header>
<div id="main">
<div id="grid" class="cols"></div>
<aside id="favpanel" hidden>
  <div class="fp-head">
    <span class="tab on" data-tab="sym">合约</span><span class="tab" data-tab="seg">K线段</span>
    <button id="fpclose" title="关闭">✕</button>
  </div>
  <div class="fp-body" id="fp-sym">
    <div class="fp-groups" id="fp-groups"></div>
    <div class="fp-tools">
      <button id="fp-add">+ 收藏当前合约</button>
      <button id="fp-newgroup">+ 新分组</button>
    </div>
    <div class="fp-hint">分组: 拖动可以调顺序 · 鼠标移上去点 × 删除 · 双击改名 · 把合约那一行拖到分组上 = 移到那个组<br>点合约名打开 · 点表头排序(再点一次反过来) · "今日"=从UTC 0点(北京时间8点)开盘算起</div>
    <table id="fp-table"><thead><tr>
      <th data-k="s">合约</th><th data-k="price">最新价</th><th data-k="chg24">24小时</th><th data-k="chgUtc">今日UTC</th>
      <th data-k="oiv" title="全部持仓的价值 = 持仓量 × 最新价">持仓价值</th><th data-k="mcap" title="市值 = 流通量 × 最新价 (数据来自币安; 少数合约没有)">市值</th><th></th>
    </tr></thead><tbody></tbody></table>
  </div>
  <div class="fp-body" id="fp-seg" hidden>
    <div class="fp-hint">收藏方法: 用📏测量(或按住Shift拖动)选一段K线, 点测量框里的"⭐ 收藏这段"。点下面任意一条, 三个周期一起跳到那一段。</div>
    <label style="display:block;margin-bottom:8px;color:var(--muted)"><input type="checkbox" id="fp-onlycur" style="width:auto"> 只看当前合约</label>
    <div id="fp-seglist"></div>
  </div>
</aside>
</div>

<script>
const API = 'https://fapi.binance.com';
const WS = 'wss://fstream.binance.com/market/stream?streams=';   // 币安2026年把行情推送挪到了 /market (旧地址能连上但不推数据)
const TZ = -new Date().getTimezoneOffset() * 60;   // 图表库按UTC显示,整体平移成本地时间
const SEC = {'1m':60,'3m':180,'5m':300,'15m':900,'30m':1800,'1h':3600,'2h':7200,'4h':14400,'6h':21600,'12h':43200,'1d':86400,
             '3d':259200,'1w':604800,'1M':2592000};   // 1月按30天估算, 真正的结束时间用 barEndOf
const LABEL = {'1m':'1分钟','3m':'3分钟','5m':'5分钟','15m':'15分钟','30m':'30分钟','1h':'1小时','2h':'2小时','4h':'4小时','6h':'6小时','12h':'12小时','1d':'1天',
               '3d':'3天','1w':'1周','1M':'1月'};
// 一根K线的收盘时刻(t: 开盘时刻, 图表时间); 月线按自然月(28~31天), 其他固定长度
function barEndOf(iv, t) {
  if (iv !== '1M') return t + SEC[iv];
  const d = new Date((t - TZ) * 1000);
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1) / 1000 + TZ;
}
const PAGE = 1500;
const PREFETCH_BARS = 300;  // 离左边还剩多少根就提前加载更早的K线
const frameJobs = new Map();
function nextFrame(key, fn) {           // 同一件事一帧只做一次(拖动时事件很密, 合并掉)
  const had = frameJobs.has(key);
  frameJobs.set(key, fn);
  if (!had) requestAnimationFrame(() => { const f = frameJobs.get(key); frameJobs.delete(key); f && f(); });
}
function lowerBound(arr, t) {           // 第一根 time >= t 的序号(K线按时间排好序)
  let lo = 0, hi = arr.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m].time < t) lo = m + 1; else hi = m; }
  return lo;
}          // 币安一次最多给1500根
const MAX_PAGES = 40;       // 为了对齐时间最多往前补多少页
const INIT_BARS = 200;      // 打开时每个窗口显示多少根
const RIGHT_PAD = 5;

const $ = id => document.getElementById(id);
const URLQ = new URLSearchParams(location.search);
const WIN = +(URLQ.get('win') || 0);                        // 0=主窗口, 1/2=拆出来的窗口
const TF = (URLQ.get('tf') || '').split(',').filter(iv => SEC[iv]);   // 这个窗口显示哪几个周期(拆分时用)
// 多个浏览器窗口之间同步: 时间/光标/合约
const chan = 'BroadcastChannel' in window ? new BroadcastChannel('mtf_sync') : null;
let fromRemote = false;
function post(msg) { if (chan && !fromRemote) chan.postMessage(msg); }
let symbol = '', panes = [], active = null, ws = null, pxFmt = null, mouseDown = false;
let logScale = true;   // 价格轴默认用对数坐标
let replay = false, replayT = null, replayIv = null;   // 固定时间(复盘): 当前时间(K线时间轴上的秒) / 基准周期
const fineCache = new Map();                              // 拼"没走完的大周期K线"用的小周期K线缓存
let measureMode = false;   // 📏测量 打开后, 直接拖动就是测量(不打开时按住 Shift 拖动)
addEventListener('pointerdown', () => { mouseDown = true; }, true);
addEventListener('pointerup', () => { mouseDown = false; if (replay) setTimeout(refreshReplay, 0); }, true);   // 松手后把大周期右边重新钉好
addEventListener('pointercancel', () => { mouseDown = false; }, true);
let lastWheel = 0, lastWheelPan = false;
// 滚轮: 上下滚/双指捏合 = 缩放; 触控板左右滑 = 平移(固定时间模式下要区分: 平移才让时间前进, 缩放不能露出未来)
addEventListener('wheel', e => { lastWheel = Date.now(); lastWheelPan = Math.abs(e.deltaX) > Math.abs(e.deltaY) && !e.ctrlKey; },
                 {capture: true, passive: true});
// 只有用户真的在拖动/滚轮缩放时才带着别的窗口滚; 实时推价、加载更早数据引起的画面变化不联动,
// 否则会把别的窗口从"对准光标"的位置拉走
const userMoving = () => mouseDown || Date.now() - lastWheel < 400;

const store = {
  get(k, d) { try { const v = localStorage.getItem('mtf_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mtf_' + k, JSON.stringify(v)); } catch {} },
};

function normSym(s) {
  s = (s || '').trim().toUpperCase().replace(/[^\p{L}\p{N}]/gu, '');   // 合约名可以有中文(比如 币安人生USDT)
  if (!s) return '';
  return s.endsWith('USDT') ? s : s + 'USDT';
}
function setStatus(t, err) { $('status').textContent = t; $('status').className = err ? 'err' : ''; }

function toBar(k) {
  return {time: Math.floor(k[0] / 1000) + TZ, open: +k[1], high: +k[2], low: +k[3], close: +k[4], value: +k[7]};
}
// ---------- 请求币安: 统一限速 + 被封时暂停 ----------
// 从本机记录器打开(http://127.0.0.1:8899)时, K线从本机数据库读, 不直接问币安, 也不用限速
const LOCAL = location.port === '8899';   // 从记录器的看盘服务打开(本机或通过Tailscale): 数据都从那台电脑读
const LOCAL_PATH = {'/fapi/v1/klines': '/api/klines', '/fapi/v1/ticker/price': '/api/price'};
const REQ_GAP = LOCAL ? 0 : 300;         // 每次请求至少间隔0.3秒(币安大约每分钟240次大批量K线请求就会限流)
let reqChain = Promise.resolve(), lastReq = 0, bannedUntil = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function apiGet(path, params) {
  const job = reqChain.then(async () => {
    while (Date.now() < bannedUntil) {
      setStatus(`被币安限流, ${new Date(bannedUntil).toLocaleTimeString()} 后自动恢复(本地已有的数据照常能看)`, true);
      await sleep(Math.min(5000, bannedUntil - Date.now()));
    }
    const wait = lastReq + REQ_GAP - Date.now();
    if (wait > 0) await sleep(wait);
    lastReq = Date.now();
    const r = await fetch(`${LOCAL && LOCAL_PATH[path] ? LOCAL_PATH[path] : API + path}?${new URLSearchParams(params)}`);
    if (r.status === 418 || r.status === 429) {      // 被限流: 记下解封时间, 之后所有请求都先等
      const txt = await r.text(), m = txt.match(/until (\d{13})/);
      bannedUntil = m ? +m[1] : Date.now() + 1000 * (+r.headers.get('Retry-After') || 60);
      throw new Error(`被币安限流, ${new Date(bannedUntil).toLocaleTimeString()} 后恢复`);
    }
    if (!r.ok) throw new Error((await r.text()).slice(0, 150));
    return r.json();
  });
  reqChain = job.catch(() => {});
  return job;
}

// ---------- 本地缓存(浏览器 IndexedDB): K线按"页"存, 每页1500根, 页的起点按时间对齐 ----------
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('mtf_kline', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('pages');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  return {
    async get(k) {
      try {
        const db = await open();
        return await new Promise(res => { const q = db.transaction('pages').objectStore('pages').get(k);
          q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); });
      } catch { return undefined; }
    },
    async set(k, v) { try { (await open()).transaction('pages', 'readwrite').objectStore('pages').put(v, k); } catch {} },
  };
})();
const pageMs = iv => PAGE * SEC[iv] * 1000;
const memPages = new Map();              // 这次打开网页里已经拿过的页(没走完的最新页30秒内不重复要)
async function getPage(iv, ps) {         // ps: 页起点(毫秒, 按 pageMs 对齐); 返回 [[开盘ms, 开, 高, 低, 收, 成交额], ...]
  const key = `${symbol}|${iv}|${ps}`, done = ps + pageMs(iv) <= Date.now() - SEC[iv] * 1000;
  const mem = memPages.get(key);
  if (mem && (done || Date.now() - mem.t < 30000)) return mem.rows;
  if (done) {
    const cached = await idb.get(key);
    if (cached) { memPages.set(key, {rows: cached, t: Date.now()}); return cached; }
  }
  const d = await apiGet('/fapi/v1/klines', {symbol, interval: iv, limit: PAGE, startTime: ps, endTime: ps + pageMs(iv) - 1});
  const rows = d.map(k => [k[0], +k[1], +k[2], +k[3], +k[4], +k[7]]);
  memPages.set(key, {rows, t: Date.now()});
  if (done) idb.set(key, rows);          // 整页都已收盘, 以后不会再变, 存到本地
  return rows;
}
const rowToBar = r => ({time: Math.floor(r[0] / 1000) + TZ, open: r[1], high: r[2], low: r[3], close: r[4], value: r[5]});
// 截止 endTime(毫秒, 不给=现在) 的最近 1500 根: 读两页拼起来, 走完的页基本都在本地
async function fetchKlines(iv, endTime) {
  const end = endTime || Date.now(), pm = pageMs(iv), p1 = Math.floor(end / pm) * pm;
  const [a, b] = await Promise.all([getPage(iv, p1 - pm), getPage(iv, p1)]);
  return a.concat(b).filter(r => r[0] <= end).slice(-PAGE).map(rowToBar);
}

// "⬇下载历史": 把当前合约各周期往前一段的K线都存到本地
const DL_DAYS = {'1m': 7, '3m': 20, '5m': 60, '15m': 180, '30m': 365, '1h': 730, '2h': 730, '4h': 1460,
                 '6h': 1460, '12h': 1460, '1d': 2000, '3d': 3000, '1w': 3000, '1M': 3000};
async function downloadHistory() {
  const ivs = [...new Set(panes.map(p => p.iv).concat(replayIv ? [replayIv] : []))];
  const jobs = [];
  for (const iv of ivs) {
    const pm = pageMs(iv), from = Date.now() - DL_DAYS[iv] * 86400000;
    for (let ps = Math.floor(Date.now() / pm) * pm; ps + pm > from; ps -= pm) jobs.push([iv, ps]);
  }
  const btn = $('dl'), sym = symbol;
  btn.disabled = true;
  let done = 0, skip = new Set();
  try {
    for (const [iv, ps] of jobs) {
      if (symbol !== sym) break;
      if (!skip.has(iv)) {
        const rows = await getPage(iv, ps);
        if (!rows.length) skip.add(iv);       // 比上市时间还早了, 这个周期不用再往前
      }
      btn.textContent = `⬇ 下载中 ${++done}/${jobs.length}`;
    }
    setStatus(`${sym} 历史已存到本机: ` + ivs.map(iv => `${LABEL[iv]}${DL_DAYS[iv]}天`).join(' / '));
  } catch (e) {
    setStatus('下载中断: ' + e.message + ' (已下载的部分保留, 稍后再点一次会接着下)', true);
  } finally { btn.disabled = false; btn.textContent = '⬇ 下载历史'; }
}

function makePxFmt(price) {
  const prec = Math.min(10, Math.max(2, 4 - Math.floor(Math.log10(Math.abs(price) || 1))));
  return {type: 'price', precision: prec, minMove: Math.pow(10, -prec)};
}
function fmtVol(v) {
  if (v >= 1e12) return (v / 1e12).toFixed(2) + 'T';
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toFixed(0);
}
function fmtTime(t) {
  const d = new Date((t - TZ) * 1000), z = n => String(n).padStart(2, '0');
  return `${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}

class Pane {
  constructor(iv, idx) {
    this.iv = iv; this.idx = idx; this.bars = []; this.all = []; this.pinUntil = 0; this.loading = false; this.exhausted = false; this.pendingT = null;
    this.el = document.createElement('div');
    this.el.className = 'pane';
    this.el.innerHTML = `<div class="bar"><select>${Object.keys(SEC).map(k =>
      `<option value="${k}"${k === iv ? ' selected' : ''}>${LABEL[k]}</option>`).join('')}</select>
      <span class="legend"></span></div><div class="chart"></div>`;
    $('grid').appendChild(this.el);
    this.legendEl = this.el.querySelector('.legend');
    this.el.querySelector('select').onchange = e => this.changeInterval(e.target.value);
    // 鼠标/手指在哪个窗口上,哪个窗口就是"带头"的,其他窗口跟着它走
    const activate = () => { if (active !== this) { active && active.el.classList.remove('active'); active = this; this.el.classList.add('active'); } };
    this.el.addEventListener('pointerenter', activate);
    this.el.addEventListener('pointerdown', activate);
    this.el.addEventListener('wheel', activate, {passive: true});

    const box = this.el.querySelector('.chart');
    this.bandEl = document.createElement('div');
    this.bandEl.className = 'band';
    box.appendChild(this.bandEl);
    this.band = null;
    this.mEl = document.createElement('div');
    this.mEl.className = 'measure';
    this.mLabel = document.createElement('div');
    this.mLabel.className = 'mlabel';
    box.append(this.mEl, this.mLabel);
    this.measure = null;                     // {a: 开始时间, b: 结束时间}
    this.box = box;
    // 横线: 画线模式下点一下 = 新线; 靠近已有横线按下 = 拖动它 / 点一下选中; 右键 = 删除
    this.plines = new Map();                 // 线id -> 图上的 PriceLine
    const relY = e => e.clientY - box.getBoundingClientRect().top;
    const wantLine = e => e.button === 0 && !e.target.closest('.favbtn') && !e.shiftKey && !measureMode && this.bars.length && (drawMode || this.lineAt(relY(e)));
    box.addEventListener('mousedown', e => { if (wantLine(e)) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
    box.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.shiftKey || measureMode) return;
      if (!wantLine(e)) { if (selLine) selectLine(null); return; }
      e.stopImmediatePropagation(); e.preventDefault();
      let ln = drawMode ? null : this.lineAt(relY(e));
      if (!ln) {
        const p = this.candle.coordinateToPrice(relY(e));
        if (p == null || !(p > 0)) return;
        ln = {id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), p, c: lineColor};
        hlines.push(ln);
        setDrawMode(false);                  // 画一条就自动退出, 免得拖图时误画
        renderLines();
        selectLine(ln.id);
        saveLines();
      }
      const y0 = e.clientY;
      let moved = false;
      const move = ev => {
        if (!moved && Math.abs(ev.clientY - y0) < 3) return;
        moved = true;
        const p = this.candle.coordinateToPrice(relY(ev));
        if (p == null || !(p > 0)) return;
        ln.p = p;
        panes.forEach(q => { const pl = q.plines.get(ln.id); pl && pl.applyOptions({price: p}); });
      };
      const up = () => {
        removeEventListener('pointermove', move, true);
        removeEventListener('pointerup', up, true);
        if (moved) saveLines(); else selectLine(ln.id);
      };
      addEventListener('pointermove', move, true);
      addEventListener('pointerup', up, true);
    }, true);
    box.addEventListener('pointermove', e => { if (!mouseDown) box.classList.toggle('nearline', !drawMode && !measureMode && !!this.lineAt(relY(e))); }, {passive: true});
    box.addEventListener('contextmenu', e => {
      const ln = this.lineAt(relY(e));
      if (!ln) return;
      e.preventDefault();
      deleteLine(ln.id);
    });
    // 测量: 在图表接到事件之前截住(捕获阶段), 不让它变成平移
    const wantMeasure = e => (measureMode || e.shiftKey) && e.button === 0 && this.bars.length && !e.target.closest('.favbtn');
    this.mLabel.addEventListener('click', e => { if (e.target.closest('.favbtn')) this.saveSeg(); });
    box.addEventListener('mousedown', e => { if (wantMeasure(e)) { e.stopPropagation(); e.preventDefault(); } }, true);
    box.addEventListener('pointerdown', e => {
      if (!wantMeasure(e)) return;
      e.stopPropagation(); e.preventDefault();
      const left = box.getBoundingClientRect().left;
      const t0 = this.timeAtX(e.clientX - left);
      if (t0 == null) return;
      this.measure = {a: t0, b: t0};
      this.renderMeasure();
      const move = ev => { const t = this.timeAtX(ev.clientX - left); if (t != null) { this.measure.b = t; this.renderMeasure(); } };
      const up = () => {
        removeEventListener('pointermove', move, true);
        removeEventListener('pointerup', up, true);
        if (this.measure && this.measure.a === this.measure.b) { this.measure = null; this.renderMeasure(); }   // 只点了一下 = 清除
      };
      addEventListener('pointermove', move, true);
      addEventListener('pointerup', up, true);
    }, true);
    this.chart = LightweightCharts.createChart(box, {
      autoSize: true,
      layout: {background: {color: '#161a1e'}, textColor: '#848e9c'},
      grid: {vertLines: {color: '#1f2429'}, horzLines: {color: '#1f2429'}},
      crosshair: {mode: LightweightCharts.CrosshairMode.Normal,
                  vertLine: {color: '#aab2bd', labelBackgroundColor: '#5e6673'},
                  horzLine: {color: '#6b7380', labelBackgroundColor: '#5e6673'}},
      rightPriceScale: {borderColor: '#2b3139', scaleMargins: {top: 0.06, bottom: 0.3}, mode: scaleMode()},
      timeScale: {borderColor: '#2b3139', timeVisible: true, secondsVisible: false, rightOffset: RIGHT_PAD, minBarSpacing: 0.1},
    });
    this.ts = this.chart.timeScale();
    this.candle = this.chart.addCandlestickSeries({
      upColor: '#0ecb81', downColor: '#f6465d', borderVisible: false, wickUpColor: '#0ecb81', wickDownColor: '#f6465d'});
    this.vol = this.chart.addHistogramSeries({priceFormat: {type: 'volume'}, priceScaleId: '', lastValueVisible: false, priceLineVisible: false});
    this.vol.priceScale().applyOptions({scaleMargins: {top: 0.72, bottom: 0.1}});
    // 持仓量: 成交额下面一排"持仓K线"(自己一个刻度), 持仓增加绿 / 减少红
    this.oi = this.chart.addCandlestickSeries({upColor: 'rgba(14,203,129,.75)', downColor: 'rgba(246,70,93,.75)',
      borderVisible: false, wickUpColor: 'rgba(14,203,129,.75)', wickDownColor: 'rgba(246,70,93,.75)',
      priceScaleId: 'oi', priceFormat: {type: 'volume'}, priceLineVisible: false, lastValueVisible: true});
    this.oi.priceScale().applyOptions({scaleMargins: {top: 0.915, bottom: 0.005}});

    this.ts.subscribeVisibleLogicalRangeChange(lr => { this.pendingRange = null; this.onRange(lr); });
    this.chart.subscribeCrosshairMove(p => this.onCross(p));
  }

  get sec() { return SEC[this.iv]; }
  barEnd(t) { return barEndOf(this.iv, t); }

  // 图表改画面要等到下一帧才生效, 这之前读到的还是旧画面; 记住刚设的, 读的时候以它为准
  setRange(r) {
    if (!this.bars.length || !isFinite(r.from) || !isFinite(r.to)) return;
    this.pendingRange = r;
    try { this.ts.setVisibleLogicalRange(r); } catch (e) { this.pendingRange = null; }   // 图表还没尺寸(窗口最小化等)时库会报错, 忽略
  }
  range() { return this.pendingRange || this.ts.getVisibleLogicalRange(); }

  lineAt(y) {                                // 鼠标附近 5 像素内的横线
    let best = null, bd = 6;
    for (const ln of hlines) {
      const ly = this.candle.priceToCoordinate(ln.p);
      if (ly == null) continue;
      const d = Math.abs(ly - y);
      if (d < bd) { bd = d; best = ln; }
    }
    return best;
  }

  volBar(b) { return {time: b.time, value: b.value, color: b.close >= b.open ? 'rgba(14,203,129,.35)' : 'rgba(246,70,93,.35)'}; }
  applyData() {
    this.candle.setData(this.bars);
    this.vol.setData(this.bars.map(b => this.volBar(b)));
    this.renderOI();
  }

  // 持仓量K线: 开=这根K线开盘时的持仓, 收=收盘时的持仓, 高低=期间最高最低(复盘时大周期截到"当前时间"); 没数据返回 null
  oiCandle(b) {
    if (!oiPts.length) return null;
    const start = (b.time - TZ) * 1000;
    let end = (this.barEnd(b.time) - TZ) * 1000;
    if (this.replayed() && replayT != null) end = Math.min(end, (replayT - TZ) * 1000);
    const upto = t => { let lo = 0, hi = oiPts.length - 1;           // 最后一个 <= t 的点
      if (oiPts[0][0] > t) return -1;
      while (lo < hi) { const m = (lo + hi + 1) >> 1; if (oiPts[m][0] <= t) lo = m; else hi = m - 1; }
      return lo; };
    const ie = upto(end);
    if (ie < 0 || oiPts[ie][0] < start - Math.max(this.sec, 300) * 1000) return null;   // 太旧的点不用
    const is = upto(start);
    const open = is >= 0 && oiPts[is][0] >= start - Math.max(this.sec, 300) * 1000 ? oiPts[is][1] : oiPts[is + 1][1];
    let high = Math.max(open, oiPts[ie][1]), low = Math.min(open, oiPts[ie][1]);
    for (let i = Math.max(is + 1, 0); i <= ie; i++) { const v = oiPts[i][1]; if (v > high) high = v; if (v < low) low = v; }
    return {time: b.time, open, high, low, close: oiPts[ie][1]};
  }
  oiForBar(b) { const c = this.oiCandle(b); return c ? c.close : null; }
  renderOI() {
    this.oi.setData(this.bars.map(b => this.oiCandle(b) || {time: b.time}));
  }
  updateOILast() {
    const b = this.bars[this.bars.length - 1], c = b && this.oiCandle(b);
    if (c) this.oi.update(c);
  }

  async load() {
    this.exhausted = false;
    this.measure = null;
    this.renderMeasure();
    const sym = symbol, iv = this.iv;
    const bars = await fetchKlines(iv);
    if (symbol !== sym || this.iv !== iv) return;      // 等数据时已经换了合约/周期: 这份作废(否则慢回来的旧合约会盖掉新的)
    this.all = this.bars = bars;
    if (pxFmt) this.candle.applyOptions({priceFormat: pxFmt});
    this.applyData();
    const n = this.bars.length;
    this.setRange({from: n - INIT_BARS, to: n - 1 + RIGHT_PAD});
    this.showLegend(this.bars[n - 1]);
  }

  async changeInterval(iv) {
    const lr = active && active !== this && active.range();
    // 记住本窗口最右边的时间: 换周期后最右边还是这个时间(原来就在最新的, 换完也在最新)
    const own = this.bars.length && this.range();
    const keepT = own && own.to < this.bars.length - 1 ? this.timeAt(own.to) : null;
    const keepW = own ? own.to - own.from : INIT_BARS;
    this.iv = iv;
    if (!TF.length) store.set('ivs', panes.map(p => p.iv));   // 拆出来的窗口不改主窗口记住的周期
    setStatus(`加载 ${LABEL[iv]}...`);
    const T0 = replayT;
    if (replay) this.pinUntil = Infinity;            // 固定时间模式: 加载时画面会先到最新, 别让它改掉固定的时间
    try { await this.load(); setStatus(''); } catch (e) { setStatus('加载失败: ' + e.message, true); return; }
    finally { if (this.pinUntil === Infinity) this.pinUntil = 0; }
    if (replay) {                                    // 固定时间不变, 基准换成现在最小的周期; 显示根数也不变
      replayT = T0;
      replayIv = panes.slice().sort((a, b) => a.sec - b.sec)[0].iv;
      post({t: 'replay', on: true, T: replayT, iv: replayIv});
      await this.loadUntil(replayT - keepW * this.sec);
      const n = this.bars.length;
      this.pinUntil = Date.now() + 300;
      this.setRange({from: n - keepW, to: n});
      refreshReplay();
      if (!this.replayed()) this.alignRight(replayT, keepW);   // 自己是基准: 右边对到固定时间, 不露出后面的K线
      this.pinUntil = Date.now() + 300;
      connectWs();
      return;
    }
    if (keepT != null) await this.showRightAt(keepT, keepW);
    else if (lr) this.centerOn(active.timeAt((lr.from + lr.to) / 2));
    connectWs();
  }

  async loadUntil(t) {                              // 往前补历史, 直到最早一根不晚于 t
    let k = 0;
    while (this.all.length && this.all[0].time > t && !this.exhausted && k++ < MAX_PAGES) {
      if (this.loading) { await new Promise(r => setTimeout(r, 100)); continue; }
      if (!(await this.loadOlder(t))) break;
    }
  }

  async showRightAt(T, w) {                         // 把时间 T 放到最右边, 显示 w 根; 历史不够先往前补
    await this.loadUntil(T - w * this.sec);
    const to = this.indexOf(T);
    this.setRange({from: to - w, to});
  }

  // 往前加载一页更早的K线,并保持画面不跳
  // until: 一直补到最早一根不晚于这个时间(一批最多20页); 不给: 补一页, 数据已经很多时一次补2~3页
  // 几页拿齐了才重画一次(数据多时每次重画要几十~上百毫秒, 一页一画会一顿一顿的)
  async loadOlder(until) {
    if (this.loading || this.exhausted || !this.all.length) return 0;
    this.loading = true;
    const sym = symbol, iv = this.iv, head = this.all[0];
    try {
      const n = this.all.length, want = until != null ? 20 : n > 30000 ? 3 : n > 10000 ? 2 : 1;
      const chunks = [];
      let first = head.time, got = 0;
      for (let k = 0; k < want; k++) {
        const older = await fetchKlines(iv, (first - TZ) * 1000 - 1);
        if (symbol !== sym || this.iv !== iv || this.all[0] !== head) return 0;   // 中途换了合约/周期: 这批作废
        if (!older.length) { this.exhausted = true; break; }
        chunks.unshift(older);
        got += older.length;
        first = older[0].time;
        if (until != null && first <= until) break;
      }
      if (!got) return 0;
      const lr = this.range();
      this.all = chunks.flat().concat(this.all);
      this.bars = this.replayed() ? this.cutBars(replayT) : this.all;
      this.applyData();
      if (lr) this.setRange({from: lr.from + got, to: lr.to + got});
      return got;
    } catch (e) {
      setStatus('加载更早数据失败: ' + e.message, true);
      return 0;
    } finally { this.loading = false; }
  }

  // 逻辑序号 <-> 时间(数据范围外按周期外推)
  timeAt(l) {
    const b = this.bars, n = b.length;
    if (l <= 0) return b[0].time + l * this.sec;
    if (l >= n - 1) return b[n - 1].time + (l - n + 1) * this.sec;
    const i = Math.floor(l);
    return b[i].time + (l - i) * (b[i + 1].time - b[i].time);
  }
  indexOf(t) {
    const b = this.bars, n = b.length;
    if (t <= b[0].time) return (t - b[0].time) / this.sec;
    if (t >= b[n - 1].time) return n - 1 + (t - b[n - 1].time) / this.sec;
    let lo = 0, hi = n - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (b[m].time <= t) lo = m; else hi = m - 1; }
    return lo + (t - b[lo].time) / (b[lo + 1].time - b[lo].time);
  }

  onRange(lr) {
    this.renderBand();
    this.renderMeasure();
    if (Date.now() < this.pinUntil) return;          // 固定时间模式下程序自己钉右边引起的变化, 不处理
    if (active !== this || !lr || !this.bars.length) return;
    if (lr.from < PREFETCH_BARS) this.loadOlder();   // 离左边还有一段就提前加载, 拖到头时不用停下来等
    if (!userMoving()) return;
    if (replay) {
      if (this.replayed()) {                         // 大周期
        if (mouseDown || lastWheelPan) {             // 拖动/平移: 它的右边就是新的"当前时间", 其他周期跟着走
          const T = Math.min(this.barEnd(this.timeAt(Math.floor(lr.to))), Math.floor(Date.now() / 1000) + TZ);
          if (T !== replayT) {
            replayT = T;
            // 正在拖的这个先不重画(重画会挪动它的画面, 时间又跟着变, 越滚越远), 松手后再截好钉好
            nextFrame('replay', () => { refreshReplay(this); post({t: 'replay', on: true, T: replayT, iv: replayIv}); });
          }
          if (!mouseDown) { clearTimeout(this.reTimer); this.reTimer = setTimeout(refreshReplay, 450); }   // 触控板平移: 停下后再截好钉好
        } else this.pin();                           // 缩放: 右边始终钉在当前时间
      }
      else if (!mouseDown && !lastWheelPan) this.alignRight(replayT);   // 基准在缩放: 右边钉住, 只缩放左边, 不露出未来
      else {                                         // 基准在拖动/平移: 它的右边就是"当前时间"
        replayIv = this.iv;
        replayT = this.rightEdgeT();
        nextFrame('replay', () => { refreshReplay(); post({t: 'replay', on: true, T: replayT, iv: replayIv}); });
      }
      return;
    }
    // 图表库每帧最多发一次这个事件, 直接同步(不再多等一帧), 别的窗口跟得更紧
    const center = this.timeAt((lr.from + lr.to) / 2);
    for (const p of panes) if (p !== this) p.centerOn(center);
    post({t: 'range', c: center});
  }

  // 让本窗口的中心对到时间 t,保持本窗口自己的缩放; 最新那头不留大片空白
  async centerOn(t) {
    this.pendingT = t;
    if (this.loading || !this.bars.length) return;
    let pages = 0;
    const w0 = this.range(), half = (w0 ? w0.to - w0.from : INIT_BARS) / 2 * this.sec;
    while (this.pendingT < this.bars[0].time && !this.exhausted && pages++ < MAX_PAGES) {
      if (!(await this.loadOlder(this.pendingT - half))) break;
    }
    const lr = this.range();
    const w = lr ? lr.to - lr.from : INIT_BARS;
    const c = this.indexOf(this.pendingT), maxTo = this.bars.length - 1 + RIGHT_PAD;
    let from = c - w / 2, to = c + w / 2;
    if (to > maxTo) { from -= to - maxTo; to = maxTo; }
    this.setRange({from, to});
  }

  barAt(t) {
    const i = Math.floor(this.indexOf(t));
    return i >= 0 && i < this.bars.length ? this.bars[i] : null;
  }

  onCross(p) {
    if (active !== this) return;
    if (this.band || this.crossT != null) { this.band = null; this.crossT = null; this.renderBand(); }   // 自己带头时,去掉之前跟随时留下的标记
    const b = p.time != null ? this.barAt(p.time) : null;
    this.showLegend(b || this.nowBar());
    for (const o of panes) {
      if (o === this || !o.bars.length) continue;
      if (b) o.followCross(b.time, this.sec, this.barEnd(b.time)); else o.clearCross();
    }
    post(b ? {t: 'cross', time: b.time, sec: this.sec, end: this.barEnd(b.time)} : {t: 'clear'});
  }

  // 别的窗口指到了时间 t(那根K线长 srcSec 秒): 本窗口光标对到同一时间;
  // 不在画面里就滚过去(还没加载就先往前加载); 比本窗口周期大的,把那一整段标亮
  async followCross(t, srcSec, srcEnd) {
    this.crossT = t;
    this.band = srcSec > this.sec ? {from: t, to: srcEnd || t + srcSec} : null;
    if (t < this.bars[0].time && !this.exhausted && !replay && !mouseDown) {
      await this.centerOn(t);
      if (this.crossT !== t) return;
    } else if (!mouseDown && !replay) {
      const lr = this.range(), i = this.indexOf(t);
      if (lr && (i < lr.from + 1 || i > lr.to - 1)) this.centerOn(t);
    }
    this.drawCross();
    requestAnimationFrame(() => this.drawCross());   // 刚滚动/刚加载完,等画面更新后再画一次,位置才准
  }

  drawCross() {
    if (this.crossT == null) return;
    const ob = this.barAt(this.crossT);
    if (ob) { this.chart.setCrosshairPosition(ob.close, ob.time, this.candle); this.showLegend(ob); }
    else this.chart.clearCrosshairPosition();
    this.renderBand();
  }

  clearCross() {
    this.crossT = null;
    this.band = null;
    this.chart.clearCrosshairPosition();
    this.showLegend(this.nowBar());
    this.renderBand();
  }

  renderBand() {
    const el = this.bandEl;
    if (!this.band || !this.bars.length) { el.style.display = 'none'; return; }
    const half = this.ts.options().barSpacing / 2;
    const a = this.ts.logicalToCoordinate(this.indexOf(this.band.from));
    const z = this.ts.logicalToCoordinate(this.indexOf(this.band.to - this.sec));
    const w = this.ts.width();
    if (a == null || z == null) { el.style.display = 'none'; return; }
    const x1 = Math.max(0, a - half), x2 = Math.min(w, z + half);
    if (x2 <= 0 || x1 >= w) { el.style.display = 'none'; return; }
    el.style.left = x1 + 'px';
    el.style.width = Math.max(2, x2 - x1) + 'px';
    el.style.height = (this.chart.paneSize ? this.chart.paneSize().height : this.el.querySelector('.chart').clientHeight - this.ts.height()) + 'px';
    el.style.display = 'block';
  }

  // 屏幕横坐标 -> 最近那根K线的开盘时间
  timeAtX(x) {
    const l = this.ts.coordinateToLogical(x);
    if (l == null || !this.bars.length) return null;
    return this.bars[Math.max(0, Math.min(this.bars.length - 1, Math.round(l)))].time;
  }

  renderMeasure() {
    const el = this.mEl, lab = this.mLabel;
    if (!this.measure || !this.bars.length) { el.style.display = lab.style.display = 'none'; return; }
    const bm = this.measure.bm;
    // 收藏的段: 按"包含这个时刻的那根"取, 别的周期也能对上; 自己量的: 按离得最近的那根
    let i0 = bm ? Math.floor(this.indexOf(this.measure.a) + 1e-6) : Math.round(this.indexOf(this.measure.a));
    let i1 = bm ? Math.floor(this.indexOf(this.measure.b) + 1e-6) : Math.round(this.indexOf(this.measure.b));
    if (i0 > i1) [i0, i1] = [i1, i0];
    i0 = Math.max(0, i0); i1 = Math.min(this.bars.length - 1, i1);
    const seg = this.bars.slice(i0, i1 + 1);
    if (!seg.length) { el.style.display = lab.style.display = 'none'; return; }
    const open = seg[0].open, close = seg[seg.length - 1].close;
    let hi = -Infinity, lo = Infinity;
    for (const b of seg) { if (b.high > hi) hi = b.high; if (b.low < lo) lo = b.low; }
    const chg = (close / open - 1) * 100, amp = lo > 0 ? (hi - lo) / lo * 100 : 0;
    const vol = seg.reduce((a, b) => a + b.value, 0);
    const secs = this.barEnd(seg[seg.length - 1].time) - seg[0].time;
    const d = Math.floor(secs / 86400), h = Math.floor(secs % 86400 / 3600), m = Math.floor(secs % 3600 / 60);
    const dur = (d ? d + '天' : '') + (h ? h + '小时' : '') + (m && !d ? m + '分' : '') || '0分';
    const up = chg >= 0, f = v => v.toFixed(pxFmt ? pxFmt.precision : 4);
    this.mStats = {a: seg[0].time, end: this.barEnd(seg[seg.length - 1].time), chg, amp, n: seg.length};
    // 位置
    const half = this.ts.options().barSpacing / 2, w = this.ts.width();
    const a = this.ts.logicalToCoordinate(i0), z = this.ts.logicalToCoordinate(i1);
    if (a == null || z == null) { el.style.display = lab.style.display = 'none'; return; }
    const x1 = Math.max(0, a - half), x2 = Math.min(w, z + half);
    if (x2 <= 0 || x1 >= w) { el.style.display = lab.style.display = 'none'; return; }
    el.className = 'measure ' + (up ? 'up' : 'down');
    el.style.left = x1 + 'px';
    el.style.width = Math.max(2, x2 - x1) + 'px';
    el.style.height = (this.chart.paneSize ? this.chart.paneSize().height : this.box.clientHeight - this.ts.height()) + 'px';
    el.style.display = 'block';
    lab.innerHTML = (bm ? `<div class="bmtag">⭐ ${LABEL[bm.iv] || bm.iv}收藏${bm.note ? ' · ' + esc(bm.note) : ''}</div>` : '')
      + `<span class="big ${up ? 'up' : 'down'}">${up ? '📈 +' : '📉 '}${chg.toFixed(2)}%</span>`
      + `&nbsp;&nbsp;振幅 <b>${amp.toFixed(2)}%</b><br>`
      + `${fmtTime(seg[0].time)} → ${fmtTime(this.barEnd(seg[seg.length - 1].time))}<br>`
      + `<span class="dim">${dur} · ${seg.length}根K线</span><br>`
      + `<span class="dim">高 ${f(hi)}  低 ${f(lo)}  额 ${fmtVol(vol)}</span>`
      + (bm ? '' : `<br><span class="favbtn">⭐ 收藏这段</span>`);
    lab.style.display = 'block';
    const lw = lab.offsetWidth;
    lab.style.left = Math.max(4, Math.min(w - lw - 4, x2 + 6 + lw > w ? x1 - lw - 6 : x2 + 6)) + 'px';
  }

  saveSeg() {                                       // 把测量选中的这段存成收藏
    const m = this.mStats;
    if (!m || !symbol) return;
    const note = prompt(`收藏 ${symbol} ${LABEL[this.iv]} 这一段 (${m.chg >= 0 ? '+' : ''}${m.chg.toFixed(2)}%)\n给它起个名字/备注(可以不填):`, '');
    if (note === null) return;
    const bm = {id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), s: symbol, iv: this.iv,
                ua: m.a - TZ, ue: m.end - TZ, chg: +m.chg.toFixed(2), amp: +m.amp.toFixed(2), note: note.trim().slice(0, 80), t: Date.now()};
    favs.segs.unshift(bm);
    saveFavs();
    this.measure = {a: m.a, b: m.end - 1, bm};
    this.renderMeasure();
    setStatus(`已收藏这段(${LABEL[this.iv]}), 在"⭐ 收藏 → K线段"里点它就能跳回来`);
  }

  async showSeg(bm) {                               // 跳到收藏的段: 这段放在中间, 前后留一些, 并标出来
    if (!this.bars.length) return;
    const a = bm.ua + TZ, end = bm.ue + TZ;
    const need = Math.max(1, (end - a) / this.sec);
    const w = Math.min(Math.max(need * 1.3 + 8, 60), Math.max(60, this.ts.width() / 0.12));
    await this.loadUntil(a - ((w - need) / 2 + 2) * this.sec);
    const i0 = Math.floor(this.indexOf(a) + 1e-6), i1 = Math.floor(this.indexOf(end - 1));
    const c = (i0 + i1) / 2, maxTo = this.bars.length - 1 + RIGHT_PAD;
    let from = c - w / 2, to = c + w / 2;
    if (to > maxTo) { from -= to - maxTo; to = maxTo; }
    this.measure = {a, b: end - 1, bm};
    this.setRange({from, to});
    this.renderMeasure();
  }

  showLegend(b) {
    if (!b) { this.legendEl.textContent = ''; return; }
    const f = v => v.toFixed(pxFmt ? pxFmt.precision : 4);
    const chg = (b.close / b.open - 1) * 100, amp = b.low > 0 ? (b.high - b.low) / b.low * 100 : 0;
    const cls = chg >= 0 ? 'up' : 'down';
    this.legendEl.innerHTML = `${fmtTime(b.time)}  开 ${f(b.open)} 高 ${f(b.high)} 低 ${f(b.low)} 收 ${f(b.close)}`
      + `  <span class="${cls}">涨跌 ${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</span>  <span style="color:#c084fc">振幅 ${amp.toFixed(2)}%</span>  <span style="color:#60a5fa">额 ${fmtVol(b.value)}</span>`
      + (() => { const v = this.oiForBar(b); return v == null ? '' : `  <span style="color:#f0b90b">仓 ${fmtVol(v)}</span>`; })();
  }

  // WebSocket推过来的最新K线
  push(b) {
    const a = this.all, n = a.length;
    if (!n || b.time < a[n - 1].time) return;
    if (b.time === a[n - 1].time) a[n - 1] = b; else a.push(b);
    if (this.bars !== a) return;                    // 固定时间模式下大周期不显示最新的
    this.candle.update(b);
    this.vol.update(this.volBar(b));
    this.updateOILast();
  }

  // 信息栏默认显示哪根: 平时是最新那根; 固定时间模式下基准周期显示"当前时间"那根(不剧透后面)
  nowBar() {
    if (replay && replayT != null && !this.replayed()) return this.barAt(replayT - 1) || this.bars[this.bars.length - 1];
    return this.bars[this.bars.length - 1];
  }

  // ---- 固定时间(复盘) ----
  replayed() { return replay && replayIv && this.sec > SEC[replayIv]; }   // 比基准周期大的才截断

  rightEdgeT() {                                    // 画面最右边那根K线的收盘时刻
    const lr = this.range(), n = this.all.length;
    const i = Math.max(0, Math.min(n - 1, Math.floor(lr ? lr.to : n - 1)));
    return this.barEnd(this.all[i].time);
  }

  // 截到时间 T: 走完的照常显示, 正在走的那根用小周期K线拼出 T 那一刻的样子
  cutBars(T) {
    const a = this.all, j = lowerBound(a, T);                   // 前 j 根在 T 之前开盘
    const k = j > 0 && this.barEnd(a[j - 1].time) > T ? j - 1 : j;   // 前 k 根已经走完(月线长短不一, 按真实收盘时刻算)
    const out = a.slice(0, k), b = a[k];
    if (b && b.time < T) {                                       // 正在走的那根: 用小周期拼出来
      const fine = this.fineBars(b.time);
      const seg = fine.slice(lowerBound(fine, b.time), lowerBound(fine, T));
      if (seg.length) {
        let high = -Infinity, low = Infinity, value = 0;
        for (const f of seg) { if (f.high > high) high = f.high; if (f.low < low) low = f.low; value += f.value; }
        out.push({time: b.time, open: seg[0].open, close: seg[seg.length - 1].close, high, low, value});
      }
    }
    return out;
  }

  // 拼 [start, start+本周期) 这根K线要用的小周期K线: 本窗口有基准周期的数据就直接用, 没有就去币安取一次(缓存)
  fineBars(start) {
    const src = panes.find(p => p.iv === replayIv);
    if (src && src.all.length && src.all[0].time <= start) return src.all;
    const key = `${symbol}|${replayIv}|${start}|${this.sec}`;
    if (fineCache.has(key)) return fineCache.get(key);
    fineCache.set(key, []);
    const iv = replayIv, s0 = (start - TZ) * 1000, e0 = (this.barEnd(start) - TZ) * 1000, pm = pageMs(iv);
    (async () => {                                   // 按页取(和别的请求共用本地缓存), 不再每根K线单独请求
      const rows = [];
      for (let ps = Math.floor(s0 / pm) * pm; ps < e0; ps += pm) rows.push(...await getPage(iv, ps));
      fineCache.set(key, rows.filter(r => r[0] >= s0 && r[0] < e0).map(rowToBar));
      nextFrame('replay', refreshReplay);
    })().catch(() => fineCache.delete(key));
    return [];
  }

  pin() {                                           // 保持缩放, 把最右边钉在最后一根(当前时间)
    const lr = this.range(), w = lr ? lr.to - lr.from : INIT_BARS, n = this.bars.length;
    this.pinUntil = Date.now() + 120;
    this.setRange({from: n + 1 - w, to: n + 1});
  }

  alignRight(T, w) {                                // 跟基准一样细或更细的周期: 不截断, 只把右边对到 T
    if (w == null) { const lr = this.range(); w = lr ? lr.to - lr.from : INIT_BARS; }
    const to = this.indexOf(T) - 0.5;              // 正好到 T 之前那根的右边, 一点"未来"都不露
    this.pinUntil = Date.now() + 120;
    this.setRange({from: to - w, to});
  }

  // 固定时间退到了本窗口已加载数据之前: 先往前补加载历史K线(补够前面一屏), 补完再重新截断显示
  ensureHistory() {
    const lr = this.range(), w = Math.max(50, lr ? lr.to - lr.from : INIT_BARS);
    const need = replayT - w * this.sec;
    if (!this.all.length || this.all[0].time <= need || this.exhausted) return false;
    if (this.ensuring) return true;
    if (Date.now() < (this.ensureRetryAt || 0)) return false;   // 刚失败过(断网等): 5秒内不再试, 免得一直狂刷
    this.ensuring = true;
    setStatus(`加载更早的${LABEL[this.iv]}K线...`);
    (async () => {
      let k = 0, failed = false;
      while (this.all[0].time > need && !this.exhausted && k++ < MAX_PAGES) {
        if (this.loading) {                          // 别的地方(提前预加载)正在加载: 等它完成, 不能原地空转(会卡死网页)
          await new Promise(r => setTimeout(r, 100));
          continue;
        }
        if (!(await this.loadOlder(need))) { failed = !this.exhausted; break; }
      }
      this.ensuring = false;
      if (failed) this.ensureRetryAt = Date.now() + 5000;
      if (replay) nextFrame('replay', () => { refreshReplay(); });
    })();
    return true;
  }

  applyReplay() {
    if (this.ensureHistory() && (this.all[0].time >= replayT || this.ensuring)) return;   // 正在补数据, 先不动画面
    if (this.replayed()) {
      const cut = this.cutBars(replayT);
      if (!cut.length) return;
      const old = this.bars, n = cut.length;
      const sameHead = old !== this.all && old.length && (old.length === n || old.length === n - 1)
        && old[0] === cut[0] && old[n - 2] === cut[n - 2];
      this.bars = cut;
      if (sameHead && n >= 2) {                      // 前面都没变(时间只往前走了一点): 只更新最后一根, 快很多
        this.candle.update(cut[n - 1]);
        this.vol.update(this.volBar(cut[n - 1]));
        this.updateOILast();
      } else this.applyData();
      this.pin();
      this.showLegend(this.bars[this.bars.length - 1]);
    } else {
      if (this.bars !== this.all) { this.bars = this.all; this.applyData(); }
      if (this.iv !== replayIv || active !== this) this.alignRight(replayT);
      // 基准周期右边还有"未来"的K线(往右拖才能前进), 把最新价那条线/标签藏起来, 信息栏显示当前时间那根
      this.candle.applyOptions({lastValueVisible: false, priceLineVisible: false});
      this.oi.applyOptions({lastValueVisible: false});
      const b = this.barAt(replayT - 1);
      if (b && this.crossT == null) this.showLegend(b);
    }
  }
}

// ---------- 持仓量 ----------
let oiPts = [], oiSym = '';                  // [[时间ms, 持仓量], ...] 按时间排好
async function loadOI() {
  const sym = symbol;
  oiPts = []; oiSym = '';
  try {
    let rows;
    if (LOCAL) rows = (await (await fetch(`/api/oi?symbol=${sym}&startTime=0`)).json()).map(r => [r[0], r[1]]);
    else {                                   // 直接问币安: 1小时的最近500个点 + 5分钟的最近500个点, 合起来
      const h = await apiGet('/futures/data/openInterestHist', {symbol: sym, period: '1h', limit: 500});
      const m = await apiGet('/futures/data/openInterestHist', {symbol: sym, period: '5m', limit: 500});
      const map = new Map();
      for (const x of h.concat(m)) map.set(+x.timestamp, +x.sumOpenInterest);
      rows = [...map].sort((a, b) => a[0] - b[0]);
    }
    if (sym !== symbol) return;
    oiPts = rows; oiSym = sym;
    panes.forEach(p => { if (p.bars.length) { p.renderOI(); p.showLegend(p.crossT != null ? p.barAt(p.crossT) : p.nowBar()); } });
  } catch (e) { console.warn('持仓量加载失败', e); }
}
async function refreshOI() {                 // 每分钟补一次最新的持仓量
  if (!symbol || oiSym !== symbol) return;
  try {
    if (LOCAL) {
      const last = oiPts.length ? oiPts[oiPts.length - 1][0] : 0;
      const rows = await (await fetch(`/api/oi?symbol=${symbol}&startTime=${last + 1}`)).json();
      rows.forEach(r => oiPts.push([r[0], r[1]]));
    } else {
      const d = await apiGet('/fapi/v1/openInterest', {symbol});
      oiPts.push([+d.time || Date.now(), +d.openInterest]);
    }
    if (!replay) panes.forEach(p => p.updateOILast());
  } catch {}
}

  } catch (e) { setStatus('收藏行情刷新失败: ' + e.message, true); }
}
function renderSegs() {
  const only = $('fp-onlycur').checked;
  const list = favs.segs.filter(b => !only || b.s === symbol);
  const dur = secs => { const d = Math.floor(secs / 86400), h = Math.floor(secs % 86400 / 3600), m = Math.floor(secs % 3600 / 60);
    return (d ? d + '天' : '') + (h ? h + '小时' : '') + (m && !d ? m + '分' : '') || '0分'; };
  $('fp-seglist').innerHTML = list.map(b => `<div class="seg" data-id="${b.id}">
    <span class="ops"><span class="x" data-edit="${b.id}" title="改备注">✎</span><span class="x" data-del="${b.id}" title="删除">✕</span></span>
    <b>${b.s.replace(/USDT$/, '')}</b><span class="tag">${LABEL[b.iv] || b.iv}收藏</span>
    <span class="${b.chg >= 0 ? 'up' : 'down'}" style="margin-left:6px">${b.chg >= 0 ? '+' : ''}${b.chg}%</span>
    <span class="dim">振幅 ${b.amp}%</span><br>
    <span class="dim">${fmtTime(b.ua + TZ)} → ${fmtTime(b.ue + TZ)} · ${dur(b.ue - b.ua)}</span>
    ${b.note ? `<div class="note">${esc(b.note)}</div>` : ''}
  </div>`).join('') || '<div style="color:var(--muted);padding:10px 0">还没有收藏的K线段</div>';
}
async function jumpSeg(bm, remote) {                 // 三个周期一起跳到收藏的段
  if (active) { active.el.classList.remove('active'); active = null; }
  if (replay) setReplay(false, true);
  if (bm.s !== symbol) openSymbol(bm.s);
  await symReady;
  if (!remote) post({t: 'seg', bm});
  await Promise.all(panes.map(p => p.showSeg(bm)));
  if (!remote) setStatus(`⭐ ${bm.s} ${LABEL[bm.iv]}收藏的段: ${fmtTime(bm.ua + TZ)} → ${fmtTime(bm.ue + TZ)}`);
}
function showFavPanel(on) {
  $('favpanel').hidden = !on;
  $('favbtn').classList.toggle('on', on);
  clearInterval(watchTimer); clearInterval(favTick);
  if (on) {
    renderFavs(); fetchWatch(); syncFavs(); connectFavWs();
    let n = 0;
    watchTimer = setInterval(() => {                 // 快照: 平时每60秒(主要为UTC开盘价); 实时推送断了就每5秒
      n += 5;
      if (document.hidden) return;
      if (Date.now() - favLiveAt > 10000 || n % 60 === 0) fetchWatch();
    }, 5000);
    favTick = setInterval(favLiveTick, 1000);
  } else closeFavWs();
}
function setFavTab(t) {
  favTab = t;
  document.querySelectorAll('.fp-head .tab').forEach(x => x.classList.toggle('on', x.dataset.tab === t));
  $('fp-sym').hidden = t !== 'sym';
  $('fp-seg').hidden = t !== 'seg';
}
$('favbtn').onclick = () => showFavPanel($('favpanel').hidden);
$('fpclose').onclick = () => showFavPanel(false);
$('star').onclick = () => toggleFav(symbol);
$('fp-add').onclick = () => { if (symbol && !favHas(symbol)) toggleFav(symbol); };
$('fp-newgroup').onclick = () => {
  const g = (prompt('新分组的名字:', '') || '').trim().slice(0, 20);
  if (!g || favs.groups.includes(g) || g === '全部') return;
  favs.groups.push(g); favGroup = g; store.set('favGroup', g); saveFavs();
};
document.querySelectorAll('.fp-head .tab').forEach(x => x.onclick = () => setFavTab(x.dataset.tab));
function deleteGroup(g) {                            // 空组直接删; 有合约的问一下, 合约移回"默认"
  const n = favs.items.filter(x => x.g === g).length;
  if (n && !confirm(`删除分组"${g}"? 里面的 ${n} 个合约会移到"默认"`)) return;
  favs.groups = favs.groups.filter(x => x !== g);
  favs.items.forEach(x => { if (x.g === g) x.g = '默认'; });
  if (favGroup === g) favGroup = '全部';
  saveFavs();
}
function renameGroup(g) {
  if (g === '全部') return;
  if (g === '默认') { alert('"默认"分组不能改名(可以拖动换位置)'); return; }
  const n = prompt(`分组"${g}"改成什么名字?`, g);
  const nn = (n || '').trim().slice(0, 20);
  if (!nn || nn === g || nn === '全部') return;
  if (favs.groups.includes(nn)) { alert(`已经有"${nn}"这个分组了`); return; }
  favs.groups = favs.groups.map(x => x === g ? nn : x);
  favs.items.forEach(x => { if (x.g === g) x.g = nn; });
  if (favGroup === g) favGroup = nn;
  saveFavs();
}
$('fp-groups').onclick = e => {
  const el = e.target.closest('[data-g]');
  if (!el) return;
  if (Date.now() - dragJustEnded < 300) return;
  if (e.target.closest('.del')) { deleteGroup(el.dataset.g); return; }
  favGroup = el.dataset.g; store.set('favGroup', favGroup);
  // 只挪高亮, 不重建按钮(重建了双击就失效)
  document.querySelectorAll('#fp-groups [data-g]').forEach(x => x.classList.toggle('on', x.dataset.g === favGroup));
  renderFavTable();
};
$('fp-groups').ondblclick = e => { const el = e.target.closest('[data-g]'); if (el) renameGroup(el.dataset.g); };
$('fp-groups').oncontextmenu = e => {                // 右键也能改名(以前的用法)
  const el = e.target.closest('[data-g]');
  if (!el || el.dataset.g === '全部') return;
  e.preventDefault(); renameGroup(el.dataset.g);
};
// ---- 拖动: 分组左右换位置(像浏览器收藏夹栏); 合约那一行拖到分组上 = 移到那个组 ----
// 用鼠标移动自己实现(不用浏览器自带拖放), 各浏览器/触屏表现一样
let dragGroup = null, dragSym = null, dragGhost = null, dragJustEnded = 0;
const clearDropMarks = () => document.querySelectorAll('.fp-groups span').forEach(x => x.classList.remove('drop-l', 'drop-r', 'drop-in', 'dragging'));
const chipAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('#fp-groups [data-g]'); };
function startDrag(e, kind, value, label, srcEl) {
  const x0 = e.clientX, y0 = e.clientY;
  let on = false;
  const move = ev => {
    if (!on) {
      if (Math.hypot(ev.clientX - x0, ev.clientY - y0) < 5) return;   // 动了5像素才算拖, 否则还是点击
      on = true;
      if (kind === 'g') dragGroup = value; else dragSym = value;
      srcEl.classList.add('dragging');
      dragGhost = document.createElement('div');
      dragGhost.className = 'drag-ghost';
      dragGhost.textContent = label;
      document.body.appendChild(dragGhost);
    }
    ev.preventDefault();
    dragGhost.style.left = ev.clientX + 12 + 'px'; dragGhost.style.top = ev.clientY + 10 + 'px';
    const el = chipAt(ev.clientX, ev.clientY);
    document.querySelectorAll('.fp-groups span').forEach(x => x !== el && x.classList.remove('drop-l', 'drop-r', 'drop-in'));
    if (!el) return;
    const g = el.dataset.g;
    if (kind === 's') { el.classList.toggle('drop-in', g !== '全部'); return; }
    if (g === value) return;
    const r = el.getBoundingClientRect(), left = g !== '全部' && ev.clientX < r.left + r.width / 2;
    el.classList.toggle('drop-l', left); el.classList.toggle('drop-r', !left);
  };
  const up = ev => {
    removeEventListener('pointermove', move, true);
    removeEventListener('pointerup', up, true);
    if (!on) return;
    dragJustEnded = Date.now();                       // 松手后紧跟的那次"点击"不算(免得切到分组/打开合约)
    const el = chipAt(ev.clientX, ev.clientY), g = el && el.dataset.g;
    if (el && kind === 's' && g !== '全部') {
      const it = favs.items.find(x => x.s === value);
      if (it && it.g !== g) { it.g = g; saveFavs(); }
    } else if (el && kind === 'g' && g !== value) {
      const after = el.classList.contains('drop-r');
      const list = favs.groups.filter(x => x !== value);
      list.splice(g === '全部' ? 0 : list.indexOf(g) + (after ? 1 : 0), 0, value);
      favs.groups = list;
      saveFavs();
    }
    dragGroup = dragSym = null;
    if (dragGhost) { dragGhost.remove(); dragGhost = null; }
    clearDropMarks();
    document.querySelectorAll('#fp-table tr.dragging').forEach(x => x.classList.remove('dragging'));
  };
  addEventListener('pointermove', move, true);
  addEventListener('pointerup', up, true);
}
$('fp-groups').addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-g]');
  if (e.button !== 0 || !el || el.dataset.g === '全部' || e.target.closest('.del')) return;
  startDrag(e, 'g', el.dataset.g, '分组: ' + el.dataset.g, el);
});
$('fp-table').addEventListener('pointerdown', e => {
  const tr = e.target.closest('tbody tr[data-s]');
  if (e.button !== 0 || !tr || e.target.closest('select, .x')) return;
  startDrag(e, 's', tr.dataset.s, tr.dataset.s.replace(/USDT$/, '') + ' → 拖到上面的分组', tr);
});
$('fp-table').onclick = e => {
  const th = e.target.closest('th[data-k]');
  if (th) {
    const k = th.dataset.k;
    favSort = {k, dir: favSort.k === k ? -favSort.dir : (k === 's' ? 1 : -1)};
    store.set('favSort', favSort); renderFavTable(); return;
  }
  const del = e.target.closest('[data-del]');
  if (del) { favs.items = favs.items.filter(x => x.s !== del.dataset.del); saveFavs(); return; }
  const nm = e.target.closest('td.nm');
  if (nm && Date.now() - dragJustEnded > 300) openSymbol(nm.parentElement.dataset.s);
};
$('fp-table').onchange = e => {
  const sel = e.target.closest('select[data-s]');
  if (!sel) return;
  const it = favs.items.find(x => x.s === sel.dataset.s);
  if (it) { it.g = sel.value; saveFavs(); }
};
$('fp-onlycur').onchange = renderSegs;
$('fp-seglist').onclick = e => {
  const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
  if (ed) {
    const b = favs.segs.find(x => x.id === ed.dataset.edit);
    const n = b && prompt('备注:', b.note || '');
    if (n != null) { b.note = n.trim().slice(0, 80); saveFavs(); }
    return;
  }
  if (del) {
    if (confirm('删除这条收藏的K线段?')) { favs.segs = favs.segs.filter(x => x.id !== del.dataset.del); saveFavs(); }
    return;
  }
  const it = e.target.closest('.seg[data-id]');
  const b = it && favs.segs.find(x => x.id === it.dataset.id);
  if (b) jumpSeg(b);
};

function setMeasureMode(on) {
  if (on && drawMode) setDrawMode(false);
  measureMode = on;
  $('measure').classList.toggle('on', on);
  document.body.classList.toggle('measuring', on);
}
addEventListener('keydown', e => {
  if (e.key === 'Escape') { panes.forEach(p => { p.measure = null; p.renderMeasure(); }); setDrawMode(false); if (selLine) selectLine(null); if (!$('favpanel').hidden) showFavPanel(false); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selLine && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); deleteLine(selLine); }
  if (e.key === 'Shift') document.body.classList.add('measuring');
});
addEventListener('keyup', e => { if (e.key === 'Shift' && !measureMode) document.body.classList.remove('measuring'); });

function setLayout(mode) {
  $('grid').className = mode;
  $('layout').textContent = mode === 'cols' ? '竖排' : '横排';
  store.set('layout', mode);
}

// ---- 启动 ----
$('src').textContent = LOCAL ? (/^(127\.0\.0\.1|localhost)$/.test(location.hostname) ? ' · 本机数据' : ' · 读取Mac数据') : '';
logScale = store.get('log', true);
const ivs = TF.length ? TF : store.get('ivs', ['1h', '15m', '5m']);
panes = ivs.map((iv, i) => new Pane(SEC[iv] ? iv : ['1h', '15m', '5m'][i], i));
if (TF.length) {                                     // 拆出来的窗口: 显示"合并"按钮, 标题标上第几个窗口
  $('split').style.display = 'none';
  $('merge').style.display = '';
  document.querySelector('header b').textContent = `多周期联动 · 窗口${WIN + 1}`;
}
$('split').onchange = e => { const n = +e.target.value; if (n > 1) split(n); };
$('merge').onclick = merge;
$('replay').onclick = () => setReplay(!replay);
$('dl').onclick = downloadHistory;
$('measure').onclick = () => setMeasureMode(!measureMode);
$('hline').onclick = () => setDrawMode(!drawMode);
$('clrlines').onclick = () => { if (hlines.length && confirm(`删除 ${symbol} 的全部 ${hlines.length} 条横线?`)) { hlines = []; selLine = null; renderLines(); saveLines(); } };
drawSwatches();
setLayout(store.get('layout', 'cols'));
setScale(logScale);
$('scale').onclick = () => setScale(!logScale);
// ---- 搜索框: 只能选币安U本位永续合约; 边打字边提示 ----
let SYMS = null, symHits = [], symSel = 0;
async function loadSymbols() {
  try {
    const list = LOCAL ? await (await fetch('/api/symbols', {cache: 'no-store'})).json()
      : (await apiGet('/fapi/v1/exchangeInfo', {})).symbols
          .filter(x => x.contractType === 'PERPETUAL' && x.quoteAsset === 'USDT' && x.status === 'TRADING').map(x => x.symbol);
    if (Array.isArray(list) && list.length) SYMS = new Set(list);
  } catch {}
}
function showSymList() {
  const q = normSym($('sym').value).replace(/USDT$/, '');
  if (!SYMS || !q) { $('symlist').hidden = true; return; }
  const all = [...SYMS].map(x => x.replace(/USDT$/, ''));
  const starts = all.filter(x => x.startsWith(q)).sort((a, b) => a.length - b.length || a.localeCompare(b));
  const inside = all.filter(x => !x.startsWith(q) && x.includes(q)).sort();
  symHits = starts.concat(inside).slice(0, 15);
  symSel = 0;
  $('symlist').innerHTML = symHits.length
    ? symHits.map((x, i) => `<div data-s="${esc(x)}" class="${i === 0 ? 'on' : ''}">${esc(x)}</div>`).join('')
    : `<div class="none">币安合约里没有 "${esc(q)}"</div>`;
  $('symlist').hidden = false;
}
function pickSym(x) { $('symlist').hidden = true; openSymbol(x); $('sym').blur(); }
$('sym').addEventListener('input', showSymList);
$('sym').addEventListener('focus', e => e.target.select());
$('sym').addEventListener('blur', () => setTimeout(() => { $('symlist').hidden = true; }, 150));
$('sym').addEventListener('keydown', e => {
  const open = !$('symlist').hidden && symHits.length;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!open) return;
    e.preventDefault();
    symSel = (symSel + (e.key === 'ArrowDown' ? 1 : -1) + symHits.length) % symHits.length;
    [...$('symlist').children].forEach((d, i) => d.classList.toggle('on', i === symSel));
    $('symlist').children[symSel].scrollIntoView({block: 'nearest'});
  } else if (e.key === 'Enter') {
    e.preventDefault();
    // 开提示里高亮的那个(打的正好是一个合约时它就排第一); 没有提示就按打的字开(不是币安合约会提示)
    pickSym(open ? symHits[symSel] : $('sym').value);
  } else if (e.key === 'Escape') { $('symlist').hidden = true; }
});
$('symlist').addEventListener('mousedown', e => {   // mousedown: 比输入框失焦先到
  const d = e.target.closest('[data-s]');
  if (d) { e.preventDefault(); pickSym(d.dataset.s); }
});
$('go').onclick = () => { const typed = normSym($('sym').value); pickSym(!SYMS || SYMS.has(typed) || !symHits.length ? $('sym').value : symHits[0]); };
$('layout').onclick = () => setLayout($('grid').className === 'cols' ? 'rows' : 'cols');
$('latest').onclick = () => {
  panes.forEach(p => {
    if (p.bars !== p.all) { p.bars = p.all; p.applyData(); }
    const n = p.bars.length, lr = p.range(), w = lr ? lr.to - lr.from : INIT_BARS;
    p.pinUntil = Date.now() + 120;
    p.setRange({from: n - 0.5 - w, to: n - 0.5});
  });
  if (replay) setTimeout(() => setReplay(true), 150);   // 固定时间模式: 当前时间回到最新
};
const q = URLQ.get('symbol') || location.hash.slice(1);
loadSymbols().then(() => {
  const first = normSym(q || store.get('symbol', 'BTCUSDT'));
  openSymbol(!SYMS || SYMS.has(first) ? first : 'BTCUSDT');
});
